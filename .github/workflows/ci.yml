name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # docker-publish.yml runs the suite before publishing

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @skr/core
      - run: npm run typecheck -w @skr/core
      - run: npm test -w @skr/core

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: billcal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/billcal_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: backend
      - run: npm run typecheck -w backend
      - run: DATABASE_URL=$TEST_DATABASE_URL npx prisma migrate deploy
        working-directory: backend
      - run: npm test -w backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w frontend
      - run: npm run build -w frontend

  docker:
    runs-on: ubuntu-latest
    needs: [core, backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build images and smoke-test the stack
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" > .env
          docker compose up -d --build --wait --wait-timeout 300
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/health/ready
          curl -fsS http://localhost:8080/api/v1/auth/config
      - name: Logs on failure
        if: failure()
        run: docker compose logs
