# Publishes the multi-arch (amd64 + arm64) app image to Docker Hub and GitHub
# Container Registry on version tags (v1.2.3), after the CI suite passes:
#   <dockerhub user>/billflow:{1.2.3, 1.2, latest}
#   ghcr.io/<owner>/billflow:{1.2.3, 1.2, latest}
# Users set BILLFLOW_IMAGE in .env to use it.
#
# Setup (once, repo Settings → Secrets and variables → Actions):
#   variable DOCKERHUB_USERNAME  your Docker Hub user name
#   secret   DOCKERHUB_TOKEN     a Docker Hub access token with Read & Write access
# and create the "billflow" repository on Docker Hub (Read & Write tokens can't).
#
# To publish an existing tag by hand: Actions → Publish images → Run workflow,
# enter the tag (v1.6.0 or later: the single image). The workflow file always
# comes from main.
name: Publish images

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish (e.g. v1.5.1)
        required: true
      latest:
        description: Also move the "latest" tag to this version
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      LATEST: ${{ github.event_name == 'push' || inputs.latest }}
    steps:
      - name: Check Docker Hub settings
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME variable and the DOCKERHUB_TOKEN secret (see the top of this workflow)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ vars.DOCKERHUB_USERNAME }}/billflow
            ghcr.io/${{ github.repository_owner }}/billflow
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ env.LATEST }}
          labels: |
            org.opencontainers.image.title=BillFlow
            org.opencontainers.image.description=Self-hosted bill & event calendar
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=billflow
          cache-to: type=gha,mode=max,scope=billflow
